<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nsecBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1630"/>
      <stop offset="1" stop-color="#05070F"/>
    </linearGradient>
    <linearGradient id="nsecShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4F8F"/>
      <stop offset="1" stop-color="#0C203C"/>
    </linearGradient>
    <linearGradient id="nsecAccent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#nsecBg)"/>

  <!-- outer glow ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10B981" stroke-opacity="0.14" stroke-width="10"/>

  <!-- shield -->
  <path d="M256 76 L384 120 V236 C384 320 330 380 256 404 C182 380 128 320 128 236 V120 Z"
        fill="url(#nsecShield)" stroke="#10B981" stroke-width="8"/>

  <!-- scan pulse arc inside shield -->
  <path d="M170 268 Q200 300 256 292 Q312 284 342 268"
        fill="none" stroke="url(#nsecAccent)" stroke-width="10" stroke-linecap="round"/>

  <!-- crosshair / radar dot -->
  <circle cx="256" cy="188" r="22" fill="none" stroke="#22D3EE" stroke-width="8"/>
  <circle cx="256" cy="188" r="6" fill="#22D3EE"/>

  <!-- scanning brackets -->
  <path d="M150 200 L150 210 M150 258 L150 248 M362 200 L362 210 M362 258 L362 248"
        stroke="#34D399" stroke-width="6" stroke-linecap="round"/>

  <!-- padlock nub -->
  <rect x="236" y="150" width="40" height="22" rx="6" fill="#34D399"/>
  <rect x="236" y="150" width="40" height="22" rx="6" fill="none" stroke="#0A1630" stroke-width="2"/>
  <path d="M244 150 v-6 a12 12 0 0 1 24 0 v6" fill="none" stroke="#34D399" stroke-width="6"/>
</svg>
